<!DOCTYPE html>
<html lang="en">
<head>
     <title>Animation</title>
     <style>
        #mybox{
            background-color: red
            ;
            padding: 10px;
            width: 20%;
            transition: 5s width ease-out, 3s padding, 3s background-color;
            animation: boxcolor 5s  linear 2s 3;
        }
        @keyframes boxcolor {
            0%{background-color: red;
            color:white}
            50%{
                background-color: blue;
                color:bisque;
                font-weight: bolder;
            }
            100%{
                background-color: green;
                color: blueviolet;
            }
        }
        #mybox:hover{
            width: 100%;
            padding:30px;
            background-color: blue;
        }
        img{
            width: 200px;
            transition: 3s transform;
            /* transition: 1s width linear, 3s transform;*/
             margin: 200px; 
        /* animation: movingbox 10s linear 2s 3 ;
        position: relative;
        } */ }
        img:hover{
            transform: rotate(360deg);
        }
        @keyframes movingbox {
            0%{
                top:0px;left:0px;
            }
            25%{
                top:0px; left:300px;
            }
            50%{
                top:300px;left:300px;
            }
            75%{
                top:300px;
                left:0px;
            }
            100%{
                top:0px; left:0px;
            }
            
        } 
        /* img:hover{
            /* width: 120px; */
            transform: rotate(360deg) scale(2,2);
        } */

     </style>
</head>
<body>
    <div id="mybox">
        Hello
    </div>
    <!-- <img src="./images/abc2.gif" alt=""> -->
    <img src="./wheel.jpeg" alt="">
</body>
</html>

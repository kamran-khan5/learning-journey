<!DOCTYPE html>
<html lang="en">
<head>
    <title>Forms</title>
</head>
<body>
    <h1>Forms</h1>
    <hr>
    <form onsubmit="">
        <h3>Registration Form</h3>
        <fieldset>
            <legend>Personal Information</legend>
        <label for="">FirstName*:</label><input type="text" name="fname" value="" placeholder="Enter Name" required / maxlength="5" minlength="3"> <br>
        <label for="">LastName: </label><input type="text" name="lname" value="">   <br> <br>
        <label for="">Email:</label>
        <input type="email" name="myemail" value=""> <br> <br>
        <label for="">DOB</label>
        <input type="date"> 
        <br><br>
        <label for="">Password</label>
        <input type="password" minlength=""> <br>
        <p>Gender:</p>
        <label for="">Male:</label> <input type="radio" name="R1" value="male"> 
        <label for="">Female</label> <input type="radio" name="R1" value="Female"> <br><br>
        <label>Universty:</label>
        <input type="text" value="COMSATS" readonly disabled>
    </fieldset>
        <br><br>
        <fieldset>
            <legend>
                Qualification
            </legend>
            <label for="">Degree: </label> <select name="degree" size="3" multiple>
                <option value="BS Computer Science">BS Computer Science</option>
                <option value="BS Electrical Engineering" selected>BS Electrical Engineering</option>
                <option value="MBA">BS Managment Sciences</option>
            </select> <br><br>
            <p>Hobbies</p> <label for="">Sports</label> <input type="checkbox" name="C1" value="Sport" checked>
            <br>
            <label for="">Traveling</label><input type="checkbox" name="C2" value="Travel">
            <br>
            <label for="">Eating</label><input type="checkbox" name="C3" value="eating">

        </fieldset>
        <fieldset>
            <legend>Extra Information</legend>
            Time: <input type="time">
            <br>
            Color: <input type="color"> 
            <br>
           Tel: <input type="tel">
           URL : <input type="url"> 
           Age : <input type="number" max="5" min="2">
           File <input type="file">
           Range: <input type="range">
           <p>Comments:</p>
           <textarea name="t1"  cols="40" rows="10">Write your comments.....</textarea>
        </fieldset>
        <br><br><br>
        <input type="submit" >
        <input type="reset" value="Clear">
     

    </form>
</body>
</html>

<html>
<head>
<style>
div {
    width: 300px;
    height: 100px;
    background-color: yellow;
    border: 1px solid black;
}

div#myDiv {
     transform: rotate(-60deg); /* Standard syntax */
}

div:hover

 {
transform: rotate(20deg) scale(2, 2);24
 }

</head>

<div>
This a normal div element.
</div>

<div id="myDiv">
